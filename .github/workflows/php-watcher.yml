name: PHP Watcher
run-name: Check ondrej/php for new PHP versions

# Checks every hour whether the ondrej/php PPA published a new PHP package (new PHP release or backported fix) for one of
# the PHP versions in src/scripts/install_php.sh. If so, it
#   1. bumps the shopware-essentials version, adds a CHANGELOG.md entry and commits it to main,
#   2. releases shopware-essentials (latest),
#   3. rebuilds every Shopware version that is "latest" or "<major>-latest" on Docker Hub
#      (from main or lts/sw-<version>, same tags), see tests/scripts/php_watch_targets.py.
# Logic: tests/scripts/php_watch.py, state: .github/php-versions.json

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

env:
  # Shopware majors that are NOT rebuilt, even if they have a <major>-latest tag (space separated, e.g. "6.5")
  SKIP_MAJORS: ""

# never run two watchers at once, otherwise both could release the same version
concurrency:
  group: php-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  watch:
    name: Check PHP Versions
    runs-on: ubuntu-latest
    steps:

      - name: Clone Code
        uses: actions/checkout@v4
        with:
          ref: main
          # if main is protected, use a token that may push to it (e.g. a PAT in this secret)
          token: ${{ secrets.PHP_WATCHER_TOKEN || github.token }}

      - name: Check ondrej/php PPA
        id: watch
        run: |
          python3 tests/scripts/php_watch.py

      - name: Commit Release
        if: steps.watch.outputs.release == 'true' || steps.watch.outputs.bootstrap == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/php-versions.json tests/svrunit
          if [ "${{ steps.watch.outputs.release }}" = "true" ]; then
            git commit -m "Release essentials ${{ steps.watch.outputs.version }} with new PHP versions"
          else
            git commit -m "Add PHP versions lock file for the PHP watcher"
          fi
          git push origin HEAD:main

      - name: Release Essentials ${{ steps.watch.outputs.version }}
        if: steps.watch.outputs.release == 'true'
        uses: ./.github/actions/circleci
        with:
          BRANCH: main
          IMAGE: shopware-essentials
          VERSION: ${{ steps.watch.outputs.version }}
          IS_LATEST: true
          IS_MAJOR_LATEST: false
          # -------------------------------------------
          CIRCLECI_KEY: ${{ secrets.CIRCLE_CI_TOKEN }}

      - name: Rebuild Shopware Images
        if: steps.watch.outputs.release == 'true'
        env:
          CIRCLECI_KEY: ${{ secrets.CIRCLE_CI_TOKEN }}
        run: |
          set -e
          # one line per image: <branch> <version> <setLatest> <setMajorLatest>
          python3 tests/scripts/php_watch_targets.py > targets.txt
          cat targets.txt
          while read -r BRANCH VERSION IS_LATEST IS_MAJOR_LATEST; do
            echo "Release shopware:$VERSION from $BRANCH (latest=$IS_LATEST, major-latest=$IS_MAJOR_LATEST)"
            (cd .circleci && sh run-img.sh "$BRANCH" "$CIRCLECI_KEY" shopware "$VERSION" "$IS_LATEST" "$IS_MAJOR_LATEST")
          done < targets.txt
